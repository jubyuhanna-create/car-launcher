name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk car-launcher-v${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Launcher build ${{ github.run_number }}
          make_latest: true
          files: car-launcher-v${{ github.run_number }}.apk
      - name: Prepare update files
        run: |
          VC=$(( ${{ github.run_number }} + 100 ))
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/drive-$VC.apk
          SIZE=$(stat -c %s dist/drive-$VC.apk)
          printf '{"versionCode": %d, "versionName": "3.0.%d", "apk": "app/drive-%d.apk", "size": %d}\n' $VC ${{ github.run_number }} $VC $SIZE > dist/app.json
          cat dist/app.json
      - name: Push update files to the dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          git init -q -b dist
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dist:dist
      - name: Publish update to drive-cars (only when the DRIVE_CARS_TOKEN secret exists)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.DRIVE_CARS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "no DRIVE_CARS_TOKEN secret, skipping"; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:$TOKEN@github.com/jubyuhanna-create/drive-cars.git" dc
          mkdir -p dc/app && rm -f dc/app/drive-*.apk
          cp dist/drive-*.apk dc/app/ && cp dist/app.json dc/app.json
          cd dc
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Drive build ${{ github.run_number }}"
          git push -q
