name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk car-launcher-v${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Car Launcher build ${{ github.run_number }}
          make_latest: true
          files: car-launcher-v${{ github.run_number }}.apk
